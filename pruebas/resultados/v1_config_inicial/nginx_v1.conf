# Balanceador de carga - GlobalLogistics S.A. (TP3)
# NGINX reparte las peticiones entre las 3 réplicas del servicio de Envíos.

worker_processes auto;

events {
    worker_connections 4096;
}

http {
    # En el log queda a qué réplica fue cada petición y cuánto tardó
    log_format balanceo '$remote_addr [$time_local] "$request" $status '
                        'upstream=$upstream_addr upstream_status=$upstream_status '
                        'tiempo=$request_time tiempo_upstream=$upstream_response_time';
    access_log /var/log/nginx/access.log balanceo buffer=64k flush=5s;

    # DNS interno de Docker. Con "resolve" NGINX vuelve a preguntar cada 5 s qué
    # contenedores hay detrás de "envios", así toma réplicas nuevas sin reiniciarse.
    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream envios_backend {
        zone envios_backend 64k;
        least_conn;   # manda cada petición a la réplica con menos conexiones activas

        # Health check pasivo: si una réplica falla 2 veces en 10 s, se saca de la
        # rotación durante 10 s y después se vuelve a probar.
        server envios:3000 resolve max_fails=2 fail_timeout=10s;

        keepalive 64;   # reutiliza conexiones con las réplicas
    }

    server {
        listen 80;

        # Health check del propio balanceador (lo usa Docker)
        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }

        # Estado de las réplicas visto desde el balanceador: consulta /health de
        # alguna réplica (sirve para chequear rápido desde afuera)
        location = /health {
            proxy_pass http://envios_backend/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            add_header X-Upstream $upstream_addr always;
        }

        # Los endpoints de administración no se exponen hacia afuera
        location /admin/ {
            return 403;
        }

        location / {
            proxy_pass http://envios_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Request-Id $request_id;

            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;

            # Si una réplica da error, timeout o 502/503/504, NGINX reintenta la
            # petición en otra réplica (el cliente ni se entera). Los POST no se
            # reintentan porque no son idempotentes.
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;

            add_header X-Upstream $upstream_addr always;
        }
    }
}
